name: Publish Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full commit SHA"
        required: false

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout target commit
        if: github.event_name == 'workflow_dispatch' && inputs.commit_sha != ''
        env:
          TARGET_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if ($env:TARGET_COMMIT -notmatch '^[a-fA-F0-9]{40}$') { throw "Enter a full commit SHA." }
          git checkout --detach $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Target commit could not be checked out." }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build output
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Install native audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit native dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Check app
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust linting
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test frontend logic
        run: npm test

      - name: Test native safeguards
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build frontend for browser checks
        run: npm run build

      - name: Install test browser
        run: npx playwright install chromium

      - name: Check UI workflows and responsiveness
        run: npm run test:ui

      - name: Prepare release metadata
        id: release_version
        run: node scripts/prepare-release.mjs

      - name: Check existing tag
        id: existing_tag
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          $tagRef = git tag --list $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Failed to check existing release tag." }
          "exists=$((-not [string]::IsNullOrWhiteSpace($tagRef)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Publish Tauri release
        if: steps.existing_tag.outputs.exists != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_version.outputs.tag }}
          releaseName: ${{ steps.release_version.outputs.release_name }}
          releaseBody: ${{ steps.release_version.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.release_version.outputs.prerelease }}
          releaseCommitish: ${{ steps.release_version.outputs.commit }}
          args: --bundles nsis
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      - name: Skip existing release
        if: steps.existing_tag.outputs.exists == 'true'
        run: Write-Output "This version is already tagged. Bump the app version before publishing another release."
