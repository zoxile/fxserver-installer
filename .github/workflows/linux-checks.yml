name: Linux Checks

on:
  push:
    branches: [feature/linux-terminal-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - name: Install native build dependencies
        # Tauri v2 Linux prerequisites, plus pkg-config and liblzma for headless builds.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev liblzma-dev \
            libwebkit2gtk-4.1-dev curl wget file libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb dbus-x11 gnome-keyring libsecret-tools rpm libarchive-tools

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test frontend safeguards
        run: npm test

      - name: Test platform compatibility
        run: node --test src/tests/linux-platform.test.mjs

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Test disposable integration guards
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Install verification tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install tauri-driver --version 2.1.0 --locked

      - name: Audit Rust dependencies
        run: python3 scripts/audit-rust.py

      - name: Verify pinned GLib security backport
        run: |
          python3 src-tauri/vendor/glib/verify_backport.py
          python3 scripts/audit-glib-backport.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check headless terminal
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features terminal --all-targets

      - name: Check headless Rust quality
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features terminal --all-targets -- -D warnings

      - name: Test headless safeguards
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features terminal

      - name: Test native secure storage
        timeout-minutes: 5
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features terminal --lib --no-run --message-format=json > "$RUNNER_TEMP/keyring-tests.json"
          test_binary="$(jq -r 'select(.profile.test == true and .target.name == "app_lib") | .executable // empty' "$RUNNER_TEMP/keyring-tests.json")"
          python3 scripts/test-linux-keyring.py "$test_binary"

      - name: Smoke test native terminal
        id: terminal
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features terminal --bin fxins --bin fxserver-manager
          node scripts/smoke-cli.mjs src-tauri/target/debug/fxins src-tauri/target/debug/fxserver-manager
          python3 scripts/test-terminal-pty.py src-tauri/target/debug/fxins
          python3 scripts/test-terminal-pty.py src-tauri/target/debug/fxserver-manager

      - name: Test console traffic in a native terminal
        timeout-minutes: 5
        env:
          FXINS_CONSOLE_PTY_BINARY: src-tauri/target/debug/fxins
        run: python3 -m unittest discover -s scripts/tests -p test_terminal_console_pty.py -v

      - name: Test FiveM firewall in an isolated network namespace
        timeout-minutes: 15
        env:
          FXI_DISPOSABLE_FIREWALL: private-network-container-v1
        run: python3 scripts/ci/firewall_integration.py --binary src-tauri/target/debug/fxins

      - name: Build frontend
        id: frontend
        run: npm run build

      - name: Check desktop
        id: desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features desktop --all-targets

      - name: Check Rust quality
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features terminal --all-targets -- -D warnings

      - name: Test desktop backend safeguards
        id: desktop-tests
        timeout-minutes: 25
        # These command-module tests are excluded from the terminal feature set.
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features desktop --lib

      - name: Test browser workflows
        timeout-minutes: 10
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Test MariaDB against disposable Ubuntu packages
        if: ${{ !cancelled() && steps.terminal.outcome == 'success' && steps.desktop-tests.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features desktop --lib --no-run --message-format=json > "$RUNNER_TEMP/database-tests.json"
          test_binary="$(jq -r 'select(.profile.test == true and .target.name == "app_lib") | .executable // empty' "$RUNNER_TEMP/database-tests.json")"
          docker build --build-arg WITH_DESKTOP_TESTS=1 --tag fxi-mariadb-ubuntu:ci - < scripts/ci/mariadb.Dockerfile
          container="fxi-db-ubuntu-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --rm --init --name "$container" \
            --env GITHUB_ACTIONS=true --env RUNNER_ENVIRONMENT=github-hosted \
            --env GITHUB_RUN_ID --env FXI_DISPOSABLE_MARIADB=github-container-v1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/test-linux-mariadb.py,target=/test.py,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/src-tauri/target/debug/fxserver-manager,target=/fxserver-manager,readonly" \
            --mount "type=bind,source=$test_binary,target=/restore-tests,readonly" \
            fxi-mariadb-ubuntu:ci python3 /test.py /fxserver-manager --packages --restore-test-binary /restore-tests

      - name: Build Linux release packages
        id: packages
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' && steps.desktop.outcome == 'success' }}
        timeout-minutes: 35
        env:
          CARGO_BUILD_JOBS: "2"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --bundles deb,rpm,appimage --config src-tauri/tauri.linux.conf.json

      - name: Check Linux package contents
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: python3 scripts/test-linux-packages.py src-tauri/target/release/bundle

      - name: Test optimized GLib iteration
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --lib platform::glib_regression -- --nocapture

      - name: Test native Linux desktop
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a python3 scripts/test-linux-desktop.py src-tauri/target/release/app

      - name: Retain native desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-linux-desktop
          path: output/native-linux/
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: output/playwright/*-failure.*
          if-no-files-found: ignore
          retention-days: 7

  headless-distros:
    name: Headless / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Debian 13
            distro: debian
            image: debian:13-slim
          - name: Fedora 44
            distro: fedora
            image: quay.io/fedora/fedora:44
          - name: Arch rolling
            distro: arch
            image: archlinux:base
    env:
      DISTRO: ${{ matrix.distro }}
      BASE_IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Prepare distro build dependencies
        timeout-minutes: 15
        shell: bash
        # Build from stdin without a source context; package setup cannot access the checkout.
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$BASE_IMAGE"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          printf 'Base image: %s\nResolved digest: %s\n' "$BASE_IMAGE" "$digest"
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE="$digest" --build-arg DISTRO="$DISTRO" \
            --tag "fxi-headless-$DISTRO:ci" - <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ARG DISTRO
          RUN case "$DISTRO" in \
                debian) apt-get update && \
                  DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
                    build-essential pkg-config libssl-dev liblzma-dev ca-certificates ;; \
                fedora) dnf -y --setopt=install_weak_deps=False install \
                  gcc gcc-c++ make pkgconf-pkg-config openssl-devel xz-devel ca-certificates ;; \
                arch) pacman -Syu --noconfirm --needed \
                  base-devel pkgconf openssl xz ca-certificates ;; \
                *) exit 1 ;; \
              esac
          DOCKERFILE
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE="$digest" --build-arg DISTRO="$DISTRO" \
            --tag "fxi-mariadb-$DISTRO:ci" - < scripts/ci/mariadb.Dockerfile

      - name: Build and test headless backend in distro
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/fxi-$DISTRO.XXXXXX")"
          echo "DISTRO_BUILD_ROOT=$scratch" >> "$GITHUB_ENV"
          mkdir -p "$scratch/cargo" "$scratch/target" "$scratch/home" "$scratch/tmp"
          toolchain="$(rustc --print sysroot)"
          container="fxi-$DISTRO-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --rm --init --name "$container" --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$toolchain,target=/opt/rust,readonly" \
            --mount "type=bind,source=$scratch,target=/ci" \
            --tmpfs /tmp:rw,nosuid,nodev,exec,mode=1777,size=512m \
            --workdir /workspace \
            --env PATH=/opt/rust/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env HOME=/ci/home --env TMPDIR=/ci/tmp \
            --env CARGO_HOME=/ci/cargo --env CARGO_TARGET_DIR=/ci/target \
            --env CARGO_BUILD_JOBS=2 --env CARGO_INCREMENTAL=0 \
            --env CARGO_PROFILE_DEV_DEBUG=0 --env CARGO_PROFILE_TEST_DEBUG=0 \
            "fxi-headless-$DISTRO:ci" /bin/sh -eu -c '
              cat /etc/os-release
              rustc --version
              cargo --version
              test "$(id -u)" -ne 0
              cargo build --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features terminal --all-targets
              cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features terminal --all-targets
            '

      - name: Test real MariaDB package and data lifecycle
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          container="fxi-db-$DISTRO-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --rm --init --name "$container" --platform linux/amd64 \
            --env GITHUB_ACTIONS=true --env RUNNER_ENVIRONMENT=github-hosted \
            --env GITHUB_RUN_ID --env FXI_DISPOSABLE_MARIADB=github-container-v1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/test-linux-mariadb.py,target=/test.py,readonly" \
            --mount "type=bind,source=$DISTRO_BUILD_ROOT/target/debug/fxserver-manager,target=/fxserver-manager,readonly" \
            "fxi-mariadb-$DISTRO:ci" python3 /test.py /fxserver-manager --packages
