[package]
name = "app"
version = "0.5.2"
description = "Desktop and terminal manager for FiveM FXServer"
authors = ["Zoxile"]
license = "MIT"
repository = "https://github.com/zoxile/fxserver-installer"
edition = "2021"
default-run = "app"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-log", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:glib"]
terminal = ["dep:clap", "dep:crossterm", "dep:ratatui", "dep:ratatui-textarea", "dep:rpassword", "dep:unicode-width"]

[[bin]]
name = "app"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "fxins"
path = "src/bin/fxins.rs"
required-features = ["terminal"]

[[bin]]
name = "fxserver-manager"
path = "src/bin/fxserver-manager.rs"
required-features = ["terminal"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [], optional = true }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
quick-xml = "0.41"
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tar = "0.4"
xz2 = "0.1"
getrandom = "0.3"
fs2 = "0.4"
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
ratatui-textarea = { version = "0.9.3", features = ["search"], optional = true }
rpassword = { version = "7", optional = true }
unicode-width = { version = "0.2", optional = true }
tauri = { version = "2.11.0", features = ["tray-icon"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
aes-gcm = "0.10"
glib = { version = "=0.18.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
glib = { path = "vendor/glib" }
