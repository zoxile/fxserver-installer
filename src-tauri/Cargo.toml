[package]
name = "app"
version = "0.4.0"
description = "Windows desktop installer and manager for FiveM FXServer"
authors = ["Zoxile"]
license = "MIT"
repository = "https://github.com/zoxile/fxserver-installer"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
quick-xml = "0.41"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
